# Fresh historical regression database, separate retained volume from Phase7 fixtures.
services:
  postgres:
    container_name: elabtrack_v2_phase7_regression_postgres
    ports: !override
      - "127.0.0.1:54832:5432"
volumes:
  elabtrack_v2_pgdata:
    name: ${PHASE7_REGRESSION_VOLUME:-elabtrack_v2_phase7_regression_pgdata}
