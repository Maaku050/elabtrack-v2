server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  include /etc/nginx/snippets/elabtrack-security-headers.conf;

  # This template listens on plain HTTP for local Compose. HSTS belongs to
  # the authoritative production HTTPS edge; never infer TLS from a header here.

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    # add_header is not inherited when this location adds its CSP (nginx 1.27).
    include /etc/nginx/snippets/elabtrack-security-headers.conf;
    # Production assets/API use this origin. Inline styles support current
    # Base UI/shadcn behavior; inline scripts/eval/external scripts remain denied.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API access when VITE_API_URL is set to /api/v1.
  location /api/ {
    include /etc/nginx/snippets/elabtrack-api-proxy.conf;
  }

  location /api/v1/auth/ {
    client_max_body_size 16k;
    include /etc/nginx/snippets/elabtrack-api-proxy.conf;
  }
}
