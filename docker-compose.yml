# eLabTrack V2 local development services. Published postgres/postgres defaults
# are local-only; this file is not a production manifest.
# Usage:  docker compose up -d postgres   (then run backend/frontend on host)

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: elabtrack_v2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-elabtrack_v2}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - elabtrack_v2_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-elabtrack_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elabtrack_v2_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside Compose, reach the postgres service by name and reuse the
      # same credentials the container was initialized with.
      # This file is local development only; production uses external config.
      APP_PORT: "8080"
      # TRUSTED_PROXIES remains empty by default. If proxy client separation is
      # needed, deliberately configure actual nginx source IPs/CIDRs in backend
      # env; do not implicitly trust the entire shared Docker/private network.
      DB_SSLMODE: disable
      DB_PORT: "5432"
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-elabtrack_v2}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at build time. Use /api/v1 to go
        # through the nginx proxy instead of calling the backend directly.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: elabtrack_v2_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  elabtrack_v2_pgdata:
    name: elabtrack_v2_pgdata
