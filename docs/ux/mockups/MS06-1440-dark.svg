" y="534" font-size="16" fill="#B0C4B8" font-weight="400">Final fine freezes; it may remain outstanding.</text><rect x="248" y="590" width="300" height="44" rx="8" fill="#80D7BC"/><text x="262" y="618" font-size="14" fill="#112A22" font-weight="600">Record return</text><text x="248" y="654" font-size="14" fill="#B0C4B8" font-weight="400">Review quantities and consequences before confirming.</text></g></svg>
