<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1334" viewBox="0 0 390 1334" role="img" aria-labelledby="title desc"><title id="title">MB14 · Borrowing terms · 390px · light</title><desc id="desc">Static eLabTrack V2 Phase 3A.2 visual proposal. Synthetic data. Not an implemented application. Full-page composition; interaction, scrolling, focus and safe-area behavior are specified separately.</desc><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="390" height="1334" fill="#F6F7F4"/><rect x="0" y="0" width="390" height="72" rx="0" fill="#FFFFFF"/><text x="16.0" y="43" font-size="22" fill="#12645C" font-weight="650">eLabTrack</text><path d="M6 9a6 6 0 0 1 12 0v7l2 2H4l2-2V9M9 21h6" transform="translate(340 25) scale(0.8333333333333334)" fill="none" stroke="#12645C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="96" font-size="14" fill="#536660" font-weight="400">FSMO / Borrower</text><text x="16.0" y="150" font-size="24" fill="#172C29" font-weight="650">Borrowing terms</text><text x="16.0" y="177" font-size="14" fill="#536660" font-weight="400">Visual proposal · synthetic sample</text><rect x="16.0" y="200" width="358" height="160" rx="12" fill="#FFFFFF" stroke="#D2DCD6"/><path d="M3 7l9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10" transform="translate(32.0 218) scale(0.8333333333333334)" fill="none" stroke="#12645C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62.0" y="238" font-size="18" fill="#172C29" font-weight="600">Version 2</text><text x="32.0" y="272" font-size="16" fill="#536660" font-weight="400">Effective · 08 Oct 2026</text><text x="32.0" y="300" font-size="16" fill="#536660" font-weight="400">Sample terms copy for layout</text><text x="32.0" y="324" font-size="16" fill="#536660" font-weight="400">review.</text><rect x="16.0" y="380" width="358" height="236" rx="12" fill="#FFFFFF" stroke="#D2DCD6"/><path d="M3 7l9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10" transform="translate(32.0 398) scale(0.8333333333333334)" fill="none" stroke="#12645C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62.0" y="418" font-size="18" fill="#172C29" font-weight="600">Before requesting</text><text x="32.0" y="452" font-size="16" fill="#536660" font-weight="400">Your submitted request holds stock</text><text x="32.0" y="476" font-size="16" fill="#536660" font-weight="400">for 24 hours.</text><text x="32.0" y="504" font-size="16" fill="#536660" font-weight="400">Visit FSMO for approval and</text><text x="32.0" y="528" font-size="16" fill="#536660" font-weight="400">physical handover.</text><text x="32.0" y="556" font-size="16" fill="#536660" font-weight="400">Return by the recorded date and</text><text x="32.0" y="580" font-size="16" fill="#536660" font-weight="400">time.</text><rect x="16.0" y="636" width="358" height="236" rx="12" fill="#FFFFFF" stroke="#D2DCD6"/><path d="M3 7l9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10" transform="translate(32.0 654) scale(0.8333333333333334)" fill="none" stroke="#12645C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62.0" y="674" font-size="18" fill="#172C29" font-weight="600">When equipment is returned</text><text x="32.0" y="708" font-size="16" fill="#536660" font-weight="400">Staff records condition and</text><text x="32.0" y="732" font-size="16" fill="#536660" font-weight="400">quantities.</text><text x="32.0" y="760" font-size="16" fill="#536660" font-weight="400">Damage or loss requires a</text><text x="32.0" y="784" font-size="16" fill="#536660" font-weight="400">replacement.</text><text x="32.0" y="812" font-size="16" fill="#536660" font-weight="400">Unresolved obligations keep</text><text x="32.0" y="836" font-size="16" fill="#536660" font-weight="400">borrowing active.</text><rect x="16.0" y="892" width="358" height="264" rx="12" fill="#FFFFFF" stroke="#D2DCD6"/><path d="M3 7l9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10" transform="translate(32.0 910) scale(0.8333333333333334)" fill="none" stroke="#12645C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62.0" y="930" font-size="18" fill="#172C29" font-weight="600">Overdue borrowing</text><text x="32.0" y="964" font-size="16" fill="#536660" font-weight="400">PHP 10 per started 24-hour overdue</text><text x="32.0" y="988" font-size="16" fill="#536660" font-weight="400">period.</text><text x="32.0" y="1016" font-size="16" fill="#536660" font-weight="400">Admin records fine clearances.</text><text x="32.0" y="1044" font-size="16" fill="#536660" font-weight="400">Existing borrowing/history stays</text><text x="32.0" y="1068" font-size="16" fill="#536660" font-weight="400">accessible</text><text x="32.0" y="1096" font-size="16" fill="#536660" font-weight="400">while updated terms await</text><text x="32.0" y="1120" font-size="16" fill="#536660" font-weight="400">acceptance.</text><rect x="16.0" y="1176" width="358" height="44" rx="8" fill="#12645C"/><text x="30.0" y="1204" font-size="14" fill="#FFFFFF" font-weight="600">Accept version 2</text><rect x="0" y="1246" width="390" height="88" rx="0" fill="#FFFFFF"/><path d="M0 1246L390 1246" fill="none" stroke="#D2DCD6"/><path d="M3 10l9-7 9 7M5 9v12h14V9M9 21v-7h6v7" transform="translate(38.75 1262) scale(0.8333333333333334)" fill="none" stroke="#536660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="10.0" y="1306" font-size="14" fill="#536660" font-weight="400">Home</text><path d="M3 7l9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10" transform="translate(136.25 1262) scale(0.8333333333333334)" fill="none" stroke="#536660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="107.5" y="1306" font-size="14" fill="#536660" font-weight="400">Equipment</text><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1" transform="translate(233.75 1262) scale(0.8333333333333334)" fill="none" stroke="#536660" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="233.0" y="1296" font-size="14" fill="#536660" font-weight="400">My</text><text x="205.0" y="1316" font-size="14" fill="#536660" font-weight="400">Borrowings</text><rect x="300.5" y="1255" width="81.5" height="70" rx="8" fill="#E3EEE9"/><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M4 21v-2a8 8 0 0 1 16 0v2" transform="translate(331.25 1262) scale(0.8333333333333334)" fill="none" stroke="#12645C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="302.5" y="1306" font-size="14" fill="#12645C" font-weight="600">Account</text></g></svg>
